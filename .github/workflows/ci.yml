name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Validate workspace JavaScript
        run: |
          python3 -c 'import re; s=open("docs/workspace.html", encoding="utf-8").read(); m=re.search(r"<script>(.*?)</script>", s, re.S); assert m, "workspace script not found"; open("/tmp/agentforge-workspace.js", "w", encoding="utf-8").write(m.group(1))'
          node --check /tmp/agentforge-workspace.js
      - name: Run vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/agentforge
      - name: Build workspace API
        run: go build ./cmd/agentforge-server
